<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Font preconnect for faster load -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- PWA manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- Theme colour -->
    <meta name="theme-color" content="#7c6aff" />

    <!-- Standard favicon -->
    <link rel="icon" type="image/png" href="/icons/icon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />

    <!-- iOS PWA support -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Groove" />
    <link rel="apple-touch-icon" href="/icons/icon-192x192.png" />
    <!-- PWA splash screen background matches app dark theme -->
    <meta name="msapplication-TileColor" content="#080810" />
    <meta name="msapplication-TileImage" content="/icons/icon-144x144.png" />
    <!-- Startup URL -->
    <link rel="apple-touch-startup-image" href="/web-app-manifest-512x512.png" />

    <!-- SEO / share -->
    <meta name="description" content="Listen to music together in real time" />
    <meta property="og:title" content="Groove Together" />
    <meta property="og:description" content="Listen to music together in real time" />
    <meta property="og:type" content="website" />

    <!-- YouTube API -->
    <link rel="preload" href="https://www.youtube.com/iframe_api" as="script" />
    <script src="https://www.youtube.com/iframe_api"></script>

    <title>Groove Together</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
